<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TVplas Portal – Kıbrıs'tan güncel haberler</title>
<meta name="description" content="Kıbrıs ile ilgili en güncel haberler, görselleriyle ve Türkçe olarak tek sayfada. Her 30 dakikada bir yenilenir.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="TVplas">
<meta property="og:title" content="TVplas Portal – Kıbrıs'tan güncel haberler">
<meta property="og:description" content="Kıbrıs ile ilgili en güncel haberler, görselleriyle ve Türkçe olarak tek sayfada. Her 30 dakikada bir yenilenir.">
<meta property="og:url" content="https://tvplas.github.io/haber/">
<meta property="og:image" content="https://tvplas.github.io/haber/kapak.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{--bg:#f4f5f7;--kart:#fff;--yazi:#1d2330;--soluk:#667085;--vurgu:#c8102e;--cizgi:#e4e7ec}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--kart:#1b2029;--yazi:#e8eaee;--soluk:#98a2b3;--vurgu:#ff5a6e;--cizgi:#2a313d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--yazi);font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif}
header{padding:24px 16px 12px;max-width:1200px;margin:auto}
h1{margin:0;font-size:30px;letter-spacing:-.5px}h1 span{color:var(--vurgu)}
.bilgi{color:var(--soluk);font-size:14px}
.arac{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 8px}
#ara{flex:1;min-width:200px;padding:10px 12px;border-radius:8px;border:1px solid var(--cizgi);background:var(--kart);color:var(--yazi);font-size:15px}
.arac button{padding:9px 14px;border-radius:20px;border:1px solid var(--cizgi);background:var(--kart);color:var(--yazi);cursor:pointer;font-size:14px}
.arac button.aktif{background:var(--vurgu);color:#fff;border-color:var(--vurgu)}
main{max-width:1200px;margin:auto;padding:0 16px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.resim{display:block;aspect-ratio:16/9;background:var(--cizgi)}
.resim img{width:100%;height:100%;object-fit:cover;display:block}
.resim.yok{aspect-ratio:auto;height:6px;background:var(--vurgu)}
.icerik{padding:12px 14px 14px;display:flex;flex-direction:column;flex:1}
.ust{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--soluk)}
.etiket{color:var(--vurgu);font-weight:600}
.ceviri{border:1px solid var(--cizgi);border-radius:4px;padding:0 5px;cursor:help}
h2{font-size:17px;margin:6px 0;line-height:1.35}h2 a{color:inherit;text-decoration:none}h2 a:hover{text-decoration:underline}
p{margin:0 0 10px;color:var(--soluk);font-size:14px}
.paylas{margin-top:auto;align-self:flex-start;font-size:13px;color:#1877f2;text-decoration:none;font-weight:600}
.durum{grid-column:1/-1;text-align:center;color:var(--soluk);padding:60px 0}
footer{text-align:center;color:var(--soluk);font-size:13px;padding:0 16px 30px}
</style>
</head>
<body>
<header>
  <h1><span>TVplas</span> Portal</h1>
  <div class="bilgi">Kıbrıs'tan güncel haberler · <span id="zaman">yükleniyor…</span></div>
  <div class="arac">
    <input id="ara" placeholder="Haberlerde ara (ör. Ercan, seçim, Mağusa)…">
    <button data-f="" class="aktif">Tümü</button>
    <button data-f="Haber sitesi">Haber siteleri</button>
    <button data-f="Arama">Haber arama</button>
    <button data-f="Sosyal">Sosyal medya</button>
  </div>
</header>
<main id="liste"><div class="durum">Haberler yükleniyor…</div></main>
<footer>Haberler kaynak sitelerine aittir; başlıklara tıklayarak haberin tamamını kaynağında okuyabilirsiniz. Yabancı dildeki haberler otomatik olarak Türkçeye çevrilmiştir.</footer>
<script>
const API = "https://script.google.com/macros/s/AKfycbxB5rIkSgfjGzjRGLnAyvz72DFYdCCpEc2PtzZo5xxS65w5SrEeNZltzILxQG7FUetUIg/exec";
let tur = "", haberler = [];
const ara = document.getElementById("ara"), liste = document.getElementById("liste");

function kac(t) {
  if (!t) return "";
  const dk = Math.round((Date.now() - new Date(t)) / 60000);
  if (dk < 1) return "az önce";
  if (dk < 60) return dk + " dk önce";
  if (dk < 1440) return Math.floor(dk / 60) + " saat önce";
  return new Date(t).toLocaleString("tr-TR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
}

function el(etiket, sinif, metin) {
  const e = document.createElement(etiket);
  if (sinif) e.className = sinif;
  if (metin != null) e.textContent = metin;
  return e;
}

function kartYap(h) {
  const kart = el("article", "kart");
  const resim = el("a", "resim" + (h.g ? "" : " yok"));
  resim.href = h.l; resim.target = "_blank"; resim.rel = "noopener";
  if (h.g) {
    const img = el("img");
    img.src = h.g; img.loading = "lazy"; img.referrerPolicy = "no-referrer"; img.alt = "";
    img.onerror = () => { resim.classList.add("yok"); img.remove(); };
    resim.append(img);
  }
  const ic = el("div", "icerik");
  const ust = el("div", "ust");
  ust.append(el("span", "etiket", h.tur), el("span", "", h.k), el("span", "", kac(h.t)));
  if (h.ob) { const c = el("span", "ceviri", "çeviri"); c.title = "Orijinal: " + h.ob; ust.append(c); }
  const h2 = el("h2"), a = el("a", "", h.b);
  a.href = h.l; a.target = "_blank"; a.rel = "noopener"; h2.append(a);
  const pay = el("a", "paylas", "Facebook'ta paylaş");
  pay.href = "https://www.facebook.com/sharer/sharer.php?u=" + encodeURIComponent(h.l);
  pay.target = "_blank"; pay.rel = "noopener";
  ic.append(ust, h2, el("p", "", h.o), pay);
  kart.append(resim, ic);
  kart.dataset.tur = h.tur;
  kart.dataset.ara = (h.b + " " + h.o + " " + h.k + " " + (h.ob || "")).toLocaleLowerCase("tr");
  return kart;
}

function suz() {
  const q = ara.value.toLocaleLowerCase("tr");
  let gorunen = 0;
  liste.querySelectorAll(".kart").forEach(k => {
    const g = (!tur || k.dataset.tur === tur) && k.dataset.ara.includes(q);
    k.style.display = g ? "" : "none";
    if (g) gorunen++;
  });
  let bos = liste.querySelector(".durum");
  if (!gorunen && haberler.length) {
    if (!bos) { bos = el("div", "durum", "Aramaya uyan haber yok."); liste.append(bos); }
  } else if (bos && haberler.length) bos.remove();
}

ara.oninput = suz;
document.querySelectorAll(".arac button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".arac button").forEach(x => x.classList.remove("aktif"));
  b.classList.add("aktif"); tur = b.dataset.f; suz();
});

async function yukle() {
  try {
    const r = await fetch(API);
    const veri = await r.json();
    haberler = veri.haberler || [];
    liste.replaceChildren(...haberler.map(kartYap));
    document.getElementById("zaman").textContent =
      haberler.length + " haber · son güncelleme " + kac(veri.guncelleme);
    suz();
  } catch (e) {
    liste.replaceChildren(el("div", "durum", "Haberler şu an yüklenemedi, lütfen sayfayı yenileyin."));
    document.getElementById("zaman").textContent = "";
  }
}
yukle();
</script>
</body>
</html>
